<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 60 560 500" width="560" height="500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>TeraBox loader</title>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .outer{stroke:#aebbd0;stroke-width:5;stroke-dasharray:70 30;animation:o 3s linear infinite}
    .inner{stroke:#fff;stroke-width:7;stroke-dasharray:85 15;animation:i 3s linear infinite}
    @keyframes o{0%{stroke-dasharray:55 45;stroke-dashoffset:0}50%{stroke-dasharray:85 15;stroke-dashoffset:-50}100%{stroke-dasharray:55 45;stroke-dashoffset:-100}}
    @keyframes i{0%{stroke-dasharray:85 15;stroke-dashoffset:0}50%{stroke-dasharray:40 60;stroke-dashoffset:-50}100%{stroke-dasharray:85 15;stroke-dashoffset:-100}}
    @media (prefers-reduced-motion:reduce){.outer,.inner{animation:none}}
  </style>
  <path class="outer" pathLength="100" filter="url(#glow)" d="M 200,105 H 470 Q 495,105 505,130 L 553,238 Q 562,258 557,280 L 515,470 Q 505,515 440,518 H 225 Q 180,515 160,490 L 108,280 Q 102,258 111,238 L 160,128 Q 170,105 200,105 Z"/>
  <path class="inner" pathLength="100" filter="url(#glow)" d="M 225,132 H 445 Q 463,132 470,148 L 515,255 Q 517,262 508,262 L 412,262 L 390,425 Q 386,445 365,445 H 305 Q 284,445 280,425 L 260,262 L 160,262 Q 152,262 155,252 L 195,148 Q 202,132 225,132 Z"/>
</svg>